name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag push is the one action that is genuinely hard to undo: reverting it
  # means deleting a published release. Re-run the suite here rather than trust
  # that CI was green on whatever commit the tag happens to point at.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      - name: embedded stack assets
        env:
          SUPERUSER: ci
          SUPERUSER_PASSWORD: ci
          PGBOUNCER_AUTH_PASSWORD: ci
          DRAGONRUN_HOME: /tmp/dragonrun-ci
        run: |
          docker compose \
            -f internal/stack/assets/docker-compose.yml \
            --profile dnsmasq \
            config -q
          shellcheck --severity=warning $(find internal/stack/assets -name '*.sh')

  goreleaser:
    name: goreleaser
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser builds the changelog from history, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
