[databases]
; Wildcard: any database name routes straight through to the cluster. This is
; what lets an app CREATE DATABASE a new tenant at runtime and connect to it
; immediately -- pgbouncer needs no restart and no config edit.
* = host=postgres port=5432 auth_user=pgbouncer_auth

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type  = scram-sha-256
auth_file  = /etc/pgbouncer/userlist.txt
auth_user  = pgbouncer_auth
auth_query = SELECT username, password FROM public.pgbouncer_get_auth($1)

; Transaction pooling is why ADMIN_DATABASE_URL points at 5432 (direct) while
; DATABASE_URL points here. Measured, not assumed:
;
;   - A bare `CREATE DATABASE` DOES pass through this port fine. Inside an
;     explicit transaction it fails -- but that is a postgres rule and it fails
;     identically on a direct connection, so it is not the reason.
;   - The real hazard is teardown: pgbouncer keeps idle SERVER connections open
;     to a tenant database, and those block `DROP DATABASE` with "is being
;     accessed by other users" even when the application has disconnected.
;     dragonrun drops WITH (FORCE) to terminate them.
;   - Transaction pooling also silently breaks session-scoped state -- advisory
;     locks, LISTEN/NOTIFY, session GUCs, temp tables. Tenant provisioning and
;     migration code leans on advisory locks, so it needs a session pool.
pool_mode = transaction

max_client_conn         = 1000
default_pool_size       = 5
min_pool_size           = 0
reserve_pool_size       = 2
reserve_pool_timeout    = 2.0
max_user_connections    = 50
max_db_connections      = 20

server_idle_timeout = 30
server_lifetime     = 1800
server_reset_query  = DISCARD ALL

ignore_startup_parameters = extra_float_digits,options,search_path

; Shared cluster: a stuck project should not be able to starve the others.
query_wait_timeout = 30

admin_users = pgbouncer_auth
stats_users = pgbouncer_auth

log_connections    = 0
log_disconnections = 0
