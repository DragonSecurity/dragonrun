# Wildcard *.test -> loopback. RFC 6761 reserves .test for exactly this, so it
# can never collide with a real domain.
#
# Deliberately NOT .dev (a real Google TLD, HSTS-preloaded -- plain http breaks)
# and NOT .local (mDNS/Bonjour -- fights macOS name resolution).
address=/test/127.0.0.1

# Answer only for .test; never act as a general resolver for the host.
no-resolv
no-hosts
domain-needed
bogus-priv

# NO listen-address here, deliberately. dnsmasq matches each query's
# DESTINATION address against the listen-address list, and 0.0.0.0 never
# matches a real destination -- it binds the socket, netstat looks healthy, and
# every query is dropped in silence. With the directive absent dnsmasq listens
# on all interfaces, which is what a single-purpose container wants anyway.
port=53
log-queries=no
